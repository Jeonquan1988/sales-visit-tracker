<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5bd8">
<title>Sales Visit Tracker V1.3 Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#0f5bd8;--blue2:#eaf2ff;--ink:#172033;--muted:#667085;--line:#dfe5ef;--bg:#f5f7fb;--green:#14804a;--orange:#b54708;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.brand{font-weight:800}.version{font-size:12px;color:var(--muted)}main{max-width:1120px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(16,24,40,.06)}.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:var(--blue2);color:var(--blue)}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#fee4e2;color:var(--red)}.big{min-height:58px;font-size:17px;width:100%}.hidden{display:none!important}.muted{color:var(--muted)}.notice{padding:12px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:12px}.success{background:#e7f6ec;border-color:#b7e4c7;color:var(--green)}.metric{padding:14px;border:1px solid var(--line);border-radius:14px}.metric b{display:block;font-size:26px;margin-top:6px}.customer{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.ok{background:#e7f6ec;color:var(--green)}.warn{background:#fff4e5;color:var(--orange)}.bad{background:#fee4e2;color:var(--red)}.active{background:var(--blue2);color:var(--blue)}label{display:block;font-size:13px;font-weight:800;margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}textarea{min-height:82px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:999px}.tab.on{background:var(--blue);color:#fff}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}img.photo{width:100px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}a{color:var(--blue)}#loading{position:fixed;inset:0;background:rgba(255,255,255,.88);display:grid;place-items:center;z-index:50;font-weight:800}.spinner{width:32px;height:32px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite;margin:auto auto 10px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:760px){main{padding:10px}.g3,.g4{grid-template-columns:1fr}.row{flex-direction:column}table{display:block;overflow:auto}.customer .btn{width:100%;min-height:52px}header{position:static}}
</style>
</head>
<body>
<div id="loading"><div><div class="spinner"></div><div id="loadingText">Connecting to cloud…</div></div></div>
<header><div><div class="brand">Sales Visit Tracker</div><div class="version">V1.3 Cloud Pilot</div></div><button id="logoutBtn" class="btn ghost hidden" onclick="logout()">Logout</button></header>
<main>
<section id="loginView">
<div class="card"><h1>Sales Login</h1><p class="muted">Tap your name to open your customer list.</p><div id="salesButtons" class="grid g3"></div></div>
<div class="card"><h2>Management Login</h2><div class="grid g3"><select id="managerRole"><option value="director">Sales Director</option><option value="boss">Boss</option></select><input id="managerPin" type="password" inputmode="numeric" placeholder="Pilot PIN"><button class="btn primary" onclick="managerLogin()">Enter Dashboard</button></div><p class="muted">Sales Director PIN: 2468 · Boss PIN: 1357</p></div>
<div id="cloudStatus" class="notice success">Cloud connected</div>
</section>
<section id="appView" class="hidden"><div class="card"><div class="row"><div><h1 id="welcome"></h1><div id="todayText" class="muted"></div></div><span id="roleBadge" class="badge active"></span></div></div><div id="tabs" class="tabs"></div><div id="content"></div></section>
</main>
<script>
const SUPABASE_URL='https://lamkjftrsceczhgmfyi.supabase.co';
const SUPABASE_KEY='sb_publishable_fYuxNsIp5PGM2seLzcHDhA_ce3BUae9';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SESSION_KEY='svt_v13_session';
let employees=[],customers=[],visits=[],session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'),tab='',photoFile=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dateISO=(d=new Date())=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const fmt=d=>d?new Date(d).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'-';
const mins=v=>v.end_time?Math.max(0,Math.round((new Date(v.end_time)-new Date(v.start_time))/60000)):0;
const employee=id=>employees.find(x=>x.id===id)||{};
const customer=id=>customers.find(x=>x.id===id)||{};
function busy(on,text='Working…'){$('loadingText').textContent=text;$('loading').classList.toggle('hidden',!on)}
function showError(error){console.error(error);alert(error?.message||String(error))}
async function loadCloud(){
 busy(true,'Connecting to cloud…');
 try{
  const [e,c,v]=await Promise.all([
   db.from('employees').select('*').order('full_name'),
   db.from('customers').select('*').order('customer_name'),
   db.from('visits').select('*').order('start_time',{ascending:false})
  ]);
  if(e.error)throw e.error;if(c.error)throw c.error;if(v.error)throw v.error;
  employees=e.data||[];customers=c.data||[];visits=v.data||[];
  renderLogin();if(session){tab=session.role==='sales'?'customers':'dashboard';render()}
 }catch(err){$('cloudStatus').className='notice';$('cloudStatus').textContent='Cloud connection failed: '+err.message;showError(err)}finally{busy(false)}
}
function renderLogin(){const sales=employees.filter(x=>x.role==='sales'&&x.employment_status==='active');$('salesButtons').innerHTML=sales.map(s=>`<button class="btn secondary big" onclick="salesLogin('${s.id}')">${esc(s.full_name)}</button>`).join('')||'<div class="notice">No sales users found.</div>'}
function salesLogin(id){session={role:'sales',userId:id};localStorage.setItem(SESSION_KEY,JSON.stringify(session));tab='customers';render()}
function managerLogin(){const role=$('managerRole').value,pin=$('managerPin').value;if((role==='director'&&pin!=='2468')||(role==='boss'&&pin!=='1357'))return alert('Incorrect PIN');session={role,userId:role};localStorage.setItem(SESSION_KEY,JSON.stringify(session));tab='dashboard';render()}
function logout(){localStorage.removeItem(SESSION_KEY);session=null;$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('logoutBtn').classList.add('hidden')}
function render(){if(!session)return;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');const name=session.role==='sales'?employee(session.userId).full_name:(session.role==='boss'?'Boss':'Sales Director');$('welcome').textContent='Welcome, '+name;$('todayText').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('roleBadge').textContent=session.role==='sales'?'Sales Representative':session.role==='boss'?'Boss':'Sales Director';const defs=session.role==='sales'?[['customers','My Customers'],['active','Active Visit'],['history','My History']]:[['dashboard','Today Dashboard'],['records','Visit Records']];$('tabs').innerHTML=defs.map(([id,label])=>`<button class="tab ${tab===id?'on':''}" onclick="tab='${id}';render()">${label}</button>`).join('');$('content').innerHTML=session.role==='sales'?(tab==='customers'?salesCustomers():tab==='active'?activeVisit():salesHistory()):(tab==='dashboard'?dashboard():records());}
function myCustomers(){return customers.filter(c=>c.assigned_sales_id===session.userId&&c.customer_status==='active')}
function activeForSales(){return visits.find(v=>v.sales_id===session.userId&&v.visit_status==='active')}
function salesCustomers(){const active=activeForSales();return `<div class="card"><div class="row"><div><h2>My Customers</h2><p class="muted">${myCustomers().length} customers assigned</p></div><input style="max-width:300px" placeholder="Search customer" oninput="filterCustomers(this.value)"></div>${active?`<div class="notice">Active visit: <b>${esc(customer(active.customer_id).customer_name)}</b>. Finish it before starting another.</div>`:''}<div id="customerList">${customerCards(myCustomers(),active)}</div></div>`}
function customerCards(list,active){return list.map(c=>`<div class="customer" data-search="${esc((c.customer_name+' '+c.address+' '+c.area).toLowerCase())}"><div class="row"><div><h3>${esc(c.customer_name)}</h3><div class="muted">${esc(c.address)}</div><div class="muted">${esc(c.mobile_number||'')}</div></div><button class="btn primary" ${active?'disabled':''} onclick="startVisit('${c.id}')">Start Visit</button></div></div>`).join('')}
function filterCustomers(q){q=q.toLowerCase().trim();document.querySelectorAll('#customerList .customer').forEach(el=>el.classList.toggle('hidden',!el.dataset.search.includes(q)))}
function getGPS(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('GPS is not supported on this device.'));navigator.geolocation.getCurrentPosition(p=>resolve({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),accuracy:Math.round(p.coords.accuracy)}),()=>reject(new Error('GPS permission is required. Please enable Location and try again.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
async function startVisit(customerId){if(activeForSales())return alert('Finish the current visit first.');busy(true,'Getting GPS and starting visit…');try{const gps=await getGPS();const payload={sales_id:session.userId,customer_id:customerId,visit_status:'active',visit_date:dateISO(),start_time:new Date().toISOString(),start_latitude:gps.lat,start_longitude:gps.lng,start_accuracy_m:gps.accuracy,device_info:navigator.userAgent,evidence_status:'pending'};const {data,error}=await db.from('visits').insert(payload).select().single();if(error)throw error;visits.unshift(data);tab='active';render()}catch(e){showError(e)}finally{busy(false)}}
function activeVisit(){const v=activeForSales();if(!v)return `<div class="card"><h2>No Active Visit</h2><p class="muted">Open My Customers and start a visit.</p></div>`;const c=customer(v.customer_id);return `<div class="card"><h2>${esc(c.customer_name)}</h2><p class="muted">${esc(c.address)}</p><span class="badge active">Started ${fmt(v.start_time)}</span><label>Take a live site photo</label><input type="file" accept="image/*" capture="environment" onchange="selectPhoto(event)"><div id="preview"></div><label>Visit result</label><select id="result"><option value="">Select result</option><option>Order Taken</option><option>No Order</option><option>Need Follow-up</option><option>Customer Closed</option><option>Payment Collected</option></select><label>Remark</label><textarea id="remark" placeholder="Customer feedback or next action"></textarea><button class="btn primary big" style="margin-top:14px" onclick="finishVisit('${v.id}')">Finish Visit</button></div>`}
function selectPhoto(e){photoFile=e.target.files[0]||null;if(!photoFile)return;if(photoFile.size>8*1024*1024){photoFile=null;e.target.value='';return alert('Photo is larger than 8MB. Please retake it.')}const url=URL.createObjectURL(photoFile);$('preview').innerHTML=`<img class="photo" style="margin-top:10px" src="${url}">`}
async function finishVisit(id){if(!photoFile)return alert('Please take a live site photo.');const result=$('result').value;if(!result)return alert('Please select a visit result.');busy(true,'Uploading photo and finishing visit…');try{const gps=await getGPS();const ext=(photoFile.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase();const path=`${session.userId}/${id}-${Date.now()}.${ext}`;const up=await db.storage.from('visit-photos').upload(path,photoFile,{upsert:false,contentType:photoFile.type||'image/jpeg'});if(up.error)throw up.error;const patch={visit_status:'completed',end_time:new Date().toISOString(),end_latitude:gps.lat,end_longitude:gps.lng,end_accuracy_m:gps.accuracy,visit_result:result,remark:$('remark').value.trim(),photo_path:path,evidence_status:'pending'};const {data,error}=await db.from('visits').update(patch).eq('id',id).select().single();if(error)throw error;visits=visits.map(v=>v.id===id?data:v);photoFile=null;tab='history';render()}catch(e){showError(e)}finally{busy(false)}}
function evidence(v){let score=0,issues=[];if(v.start_latitude!=null)score++;else issues.push('No start GPS');if(v.end_latitude!=null)score++;else issues.push('No end GPS');if(v.photo_path)score++;else issues.push('No photo');if(mins(v)>=2)score++;else issues.push('Very short');if((v.start_accuracy_m||999)<=100)score++;else issues.push('Low GPS accuracy');return{label:score>=5?'Reliable':score>=3?'Review':'Insufficient',cls:score>=5?'ok':score>=3?'warn':'bad',issues}}
function salesHistory(){const rows=visits.filter(v=>v.sales_id===session.userId);return `<div class="card"><h2>My Visit History</h2>${rows.length?rows.map(v=>`<div class="customer"><b>${esc(customer(v.customer_id).customer_name)}</b><div class="muted">${fmt(v.start_time)} · ${v.visit_status}${v.visit_status==='completed'?' · '+mins(v)+' min':''}</div></div>`).join(''):'<p class="muted">No records yet.</p>'}</div>`}
function dashboard(){const today=dateISO(),todayVisits=visits.filter(v=>v.visit_date===today),done=todayVisits.filter(v=>v.visit_status==='completed'),sales=employees.filter(e=>e.role==='sales');return `<div class="grid g4"><div class="metric">Pilot Sales<b>${sales.length}</b></div><div class="metric">Visits Today<b>${todayVisits.length}</b></div><div class="metric">Completed<b>${done.length}</b></div><div class="metric">Need Review<b>${done.filter(v=>evidence(v).label!=='Reliable').length}</b></div></div><div class="card"><div class="row"><h2>Today by Sales Representative</h2><button class="btn secondary" onclick="refreshCloud()">Refresh</button></div><table><thead><tr><th>Sales</th><th>Customers</th><th>Started</th><th>Completed</th><th>Reliable</th></tr></thead><tbody>${sales.map(s=>{const mine=todayVisits.filter(v=>v.sales_id===s.id),comp=mine.filter(v=>v.visit_status==='completed');return `<tr><td>${esc(s.full_name)}</td><td>${customers.filter(c=>c.assigned_sales_id===s.id).length}</td><td>${mine.length}</td><td>${comp.length}</td><td>${comp.filter(v=>evidence(v).label==='Reliable').length}</td></tr>`}).join('')}</tbody></table></div>`}
async function photoUrl(path){const {data,error}=await db.storage.from('visit-photos').createSignedUrl(path,3600);if(error)throw error;return data.signedUrl}
function records(){const rows=visits;return `<div class="card"><div class="row"><h2>Visit Records</h2><button class="btn secondary" onclick="refreshCloud()">Refresh</button></div>${rows.length?`<table><thead><tr><th>Sales</th><th>Customer</th><th>Time</th><th>Duration</th><th>Evidence</th><th>Photo</th><th>Map</th></tr></thead><tbody>${rows.map(v=>{const ev=evidence(v);return `<tr><td>${esc(employee(v.sales_id).full_name)}</td><td>${esc(customer(v.customer_id).customer_name)}<br><span class="muted">${esc(v.visit_result||'')}</span></td><td>${fmt(v.start_time)}<br>${fmt(v.end_time)}</td><td>${mins(v)} min</td><td><span class="badge ${ev.cls}">${ev.label}</span><br><small>${esc(ev.issues.join(', '))}</small></td><td>${v.photo_path?`<button class="btn secondary" onclick="openPhoto('${esc(v.photo_path)}')">View</button>`:'-'}</td><td>${v.start_latitude!=null?`<a target="_blank" href="https://www.google.com/maps?q=${v.start_latitude},${v.start_longitude}">Open map</a><br><small>±${v.start_accuracy_m||'-'}m</small>`:'-'}</td></tr>`}).join('')}</tbody></table>`:'<p class="muted">No records yet.</p>'}</div>`}
async function openPhoto(path){busy(true,'Opening photo…');try{window.open(await photoUrl(path),'_blank')}catch(e){showError(e)}finally{busy(false)}}
async function refreshCloud(){busy(true,'Refreshing cloud data…');try{const {data,error}=await db.from('visits').select('*').order('start_time',{ascending:false});if(error)throw error;visits=data||[];render()}catch(e){showError(e)}finally{busy(false)}}
db.channel('visit-changes').on('postgres_changes',{event:'*',schema:'public',table:'visits'},()=>{if(session&&session.role!=='sales')refreshCloud()}).subscribe();
loadCloud();
</script>
</body>
</html>
