<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Sales Visit Tracker V1.2</title>
<style>
:root{--blue:#0f5bd8;--blue2:#eaf2ff;--ink:#172033;--muted:#667085;--line:#dfe5ef;--bg:#f5f7fb;--green:#14804a;--orange:#b54708;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:white;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800}.version{color:var(--muted);font-size:12px}main{max-width:1180px;margin:auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(16,24,40,.06)}
.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800}.primary{background:var(--blue);color:white}.secondary{background:var(--blue2);color:var(--blue)}.danger{background:#fee4e2;color:var(--red)}.ghost{background:white;border:1px solid var(--line)}
.big{min-height:58px;font-size:17px;width:100%}.hidden{display:none!important}.muted{color:var(--muted)}.metric{padding:14px;border:1px solid var(--line);border-radius:14px;background:white}.metric b{display:block;font-size:26px;margin-top:6px}
.customer{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.ok{background:#e7f6ec;color:var(--green)}.warn{background:#fff4e5;color:var(--orange)}.bad{background:#fee4e2;color:var(--red)}.active{background:var(--blue2);color:var(--blue)}label{display:block;font-size:13px;font-weight:800;margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:white}textarea{min-height:82px}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;border:1px solid var(--line);background:white;padding:10px 12px;border-radius:999px}.tab.on{background:var(--blue);color:white}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}img.photo{width:90px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.notice{padding:12px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:12px}
progress{width:100%}
@media(max-width:760px){main{padding:10px}.g3,.g4{grid-template-columns:1fr}header{position:static}table{display:block;overflow:auto}.desktop-only{display:none}.customer .row{flex-direction:column}}
</style>
</head>

const KEY='svt_v12_data',SESSION='svt_v12_session';
let state=load(), session=JSON.parse(localStorage.getItem(SESSION)||'null'), tab='';

function seed(){return {visits:[],customerLocations:{}}}
function load(){try{return Object.assign(seed(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return seed()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function uid(){return 'VIS-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nowISO(){return new Date().toISOString()}
function dateISO(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function fmt(dt){return dt?new Date(dt).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'-'}
function mins(v){return v.endTime?Math.max(0,Math.round((new Date(v.endTime)-new Date(v.startTime))/60000)):0}
function salesById(id){return SALES.find(s=>s.id===id)}
function custById(id){return CUSTOMERS.find(c=>c.id===id)}

function initLogin(){
 document.getElementById('salesButtons').innerHTML=SALES.map(s=>`<button class="btn secondary big" onclick="salesLogin('${s.id}')">${esc(s.name)}</button>`).join('');
}
function salesLogin(id){session={role:'sales',userId:id};localStorage.setItem(SESSION,JSON.stringify(session));tab='customers';render()}
function managerLogin(){
 const role=document.getElementById('managerRole').value,pin=document.getElementById('managerPin').value;
 if((role==='director'&&pin!=='2468')||(role==='boss'&&pin!=='1357'))return alert('Incorrect PIN');
 session={role,userId:role};localStorage.setItem(SESSION,JSON.stringify(session));tab='dashboard';render();
}
function logout(){localStorage.removeItem(SESSION);session=null;document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');document.getElementById('logoutBtn').style.display='none'}
function render(){
 if(!session)return;
 document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('logoutBtn').style.display='block';
 const u=session.role==='sales'?salesById(session.userId):{name:session.role==='boss'?'Boss':'Sales Director'};
 document.getElementById('welcome').textContent='Welcome, '+u.name;
 document.getElementById('todayText').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 document.getElementById('roleBadge').textContent=session.role==='sales'?'Sales Representative':session.role==='boss'?'Boss':'Sales Director';
 const defs=session.role==='sales'?[['customers','My Customers'],['active','Active Visit'],['history','My History']]:[['dashboard','Today Dashboard'],['records','Visit Records'],['data','Pilot Data']];
 document.getElementById('tabs').innerHTML=defs.map(x=>`<button class="tab ${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('');
 document.getElementById('content').innerHTML=session.role==='sales'?(tab==='customers'?salesCustomers():tab==='active'?activeVisitView():salesHistory()):(tab==='dashboard'?dashboard():tab==='records'?records():pilotData());
}
function myCustomers(){return CUSTOMERS.filter(c=>c.salesId===session.userId)}
function salesCustomers(){
 const active=state.visits.find(v=>v.salesId===session.userId&&v.status==='active');
 return `<div class="card"><h2>My Active Customers</h2><p class="muted">${myCustomers().length} customers assigned for the pilot.</p>
 ${active?`<div class="notice">You already have an active visit at <b>${esc(custById(active.customerId).name)}</b>. Finish it before starting another.</div>`:''}
 ${myCustomers().map(c=>`<div class="customer"><div class="row"><div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.address)}</div><div class="muted">${esc(c.mobile||'')}</div></div><button class="btn primary big" ${active?'disabled':''} onclick="startVisit('${c.id}')">Start Visit</button></div></div>`).join('')}</div>`;
}
function getGPS(){
 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation)return reject(new Error('GPS is not supported on this device.'));
  navigator.geolocation.getCurrentPosition(p=>resolve({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),accuracy:Math.round(p.coords.accuracy)}),e=>reject(new Error('GPS permission is required to start or finish a visit.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 });
}
async function startVisit(customerId){
 if(state.visits.some(v=>v.salesId===session.userId&&v.status==='active'))return alert('Finish the current visit first.');
 try{
  const gps=await getGPS();
  state.visits.push({id:uid(),salesId:session.userId,customerId,status:'active',date:dateISO(),startTime:nowISO(),startGPS:gps,photo:null,result:null,remark:'',endTime:null,endGPS:null});
  save();tab='active';render();
 }catch(e){alert(e.message)}
}
function activeVisitView(){
 const v=state.visits.find(v=>v.salesId===session.userId&&v.status==='active');
 if(!v)return `<div class="card"><h2>No Active Visit</h2><p class="muted">Start a visit from My Customers.</p></div>`;
 const c=custById(v.customerId);
 return `<div class="card"><h2>${esc(c.name)}</h2><p class="muted">${esc(c.address)}</p><div class="badge active">Started ${fmt(v.startTime)}</div>
 <label>Take a live site photo</label><input id="photoInput" type="file" accept="image/*" capture="environment" onchange="previewPhoto(event)">
 <div id="photoPreview">${v.photo?`<img class="photo" src="${v.photo}">`:''}</div>
 <label>Visit result</label><select id="result"><option value="">Select result</option><option>Order Taken</option><option>No Order</option><option>Need Follow-up</option><option>Customer Closed</option><option>Payment Collected</option></select>
 <label>Remark</label><textarea id="remark" placeholder="Key customer feedback or next action"></textarea>
 <button class="btn primary big" style="margin-top:14px" onclick="finishVisit('${v.id}')">Finish Visit</button></div>`;
}
function previewPhoto(e){
 const f=e.target.files[0];if(!f)return;
 if(f.size>8*1024*1024){alert('Photo is too large. Please retake at a lower resolution.');e.target.value='';return}
 const r=new FileReader();r.onload=()=>{document.getElementById('photoPreview').innerHTML=`<img class="photo" src="${r.result}">`;document.getElementById('photoPreview').dataset.photo=r.result};r.readAsDataURL(f);
}
async function finishVisit(id){
 const v=state.visits.find(x=>x.id===id),result=document.getElementById('result').value,photo=document.getElementById('photoPreview').dataset.photo||v.photo;
 if(!photo)return alert('A live site photo is required.');
 if(!result)return alert('Select a visit result.');
 try{
  const gps=await getGPS();
  Object.assign(v,{status:'completed',endTime:nowISO(),endGPS:gps,photo,result,remark:document.getElementById('remark').value.trim()});
  if(!state.customerLocations[v.customerId])state.customerLocations[v.customerId]={lat:v.startGPS.lat,lng:v.startGPS.lng,accuracy:v.startGPS.accuracy,sourceVisitId:v.id,confirmed:false};
  save();tab='history';render();
 }catch(e){alert(e.message)}
}
function evidence(v){
 let score=0,issues=[];
 if(v.startGPS)score++;else issues.push('No start GPS');
 if(v.endGPS)score++;else issues.push('No end GPS');
 if(v.photo)score++;else issues.push('No photo');
 if(mins(v)>=2)score++;else issues.push('Very short visit');
 if(v.startGPS&&v.startGPS.accuracy<=100)score++;else issues.push('Low GPS accuracy');
 return {label:score>=5?'Reliable':score>=3?'Review':'Insufficient',cls:score>=5?'ok':score>=3?'warn':'bad',issues};
}
function salesHistory(){
 const rows=state.visits.filter(v=>v.salesId===session.userId).sort((a,b)=>(b.startTime||'').localeCompare(a.startTime||''));
 return `<div class="card"><h2>My Visit History</h2>${rows.length?rows.map(v=>`<div class="customer"><b>${esc(custById(v.customerId).name)}</b><div class="muted">${fmt(v.startTime)} · ${v.status}${v.status==='completed'?' · '+mins(v)+' min':''}</div></div>`).join(''):'<p class="muted">No records yet.</p>'}</div>`;
}
function dashboard(){
 const today=dateISO(), visits=state.visits.filter(v=>v.date===today),done=visits.filter(v=>v.status==='completed');
 return `<div class="grid g4"><div class="metric">Pilot Sales<b>3</b></div><div class="metric">Visits Today<b>${visits.length}</b></div><div class="metric">Completed<b>${done.length}</b></div><div class="metric">Need Review<b>${done.filter(v=>evidence(v).label!=='Reliable').length}</b></div></div>
 <div class="card"><h2>Today by Sales Representative</h2><table><thead><tr><th>Sales</th><th>Customers</th><th>Started</th><th>Completed</th><th>Reliable</th></tr></thead><tbody>${SALES.map(s=>{
 const mine=visits.filter(v=>v.salesId===s.id),comp=mine.filter(v=>v.status==='completed');
 return `<tr><td>${s.name}</td><td>${CUSTOMERS.filter(c=>c.salesId===s.id).length}</td><td>${mine.length}</td><td>${comp.length}</td><td>${comp.filter(v=>evidence(v).label==='Reliable').length}</td></tr>`}).join('')}</tbody></table></div>`;
}
function records(){
 const rows=[...state.visits].sort((a,b)=>(b.startTime||'').localeCompare(a.startTime||''));
 return `<div class="card"><h2>Visit Records</h2>${rows.length?`<table><thead><tr><th>Sales</th><th>Customer</th><th>Time</th><th>Duration</th><th>Evidence</th><th>Photo</th><th>Map</th></tr></thead><tbody>${rows.map(v=>{const ev=evidence(v);return `<tr><td>${salesById(v.salesId).name}</td><td>${esc(custById(v.customerId).name)}<br><span class="muted">${esc(v.result||'')}</span></td><td>${fmt(v.startTime)}<br>${fmt(v.endTime)}</td><td>${mins(v)} min</td><td><span class="badge ${ev.cls}">${ev.label}</span><br><small>${ev.issues.join(', ')}</small></td><td>${v.photo?`<img class="photo" src="${v.photo}">`:'-'}</td><td>${v.startGPS?`<a target="_blank" href="https://www.google.com/maps?q=${v.startGPS.lat},${v.startGPS.lng}">Open map</a><br><small>±${v.startGPS.accuracy}m</small>`:'-'}</td></tr>`}).join('')}</tbody></table>`:'<p class="muted">No records yet.</p>'}</div>`;
}
function pilotData(){
 return `<div class="card"><h2>Pilot Master Data</h2><p>3 sales representatives · 61 active customers</p><button class="btn secondary" onclick="exportData()">Export Pilot Records</button><button class="btn danger" style="margin-left:8px" onclick="resetPilot()">Reset Device Data</button><p class="muted" style="margin-top:12px">This device stores the current pilot records locally. Cloud synchronization is the next deployment step.</p></div>`;
}
function exportData(){const blob=new Blob([JSON.stringify({exportedAt:nowISO(),sales:SALES,customers:CUSTOMERS,state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SVT_Pilot_'+dateISO()+'.json';a.click();URL.revokeObjectURL(a.href)}
function resetPilot(){if(confirm('Delete all visit records on this device?')){state=seed();save();render()}}
initLogin();if(session){tab=session.role==='sales'?'customers':'dashboard';render()}
</script>
</body>
</html>
