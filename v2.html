<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b57d0">
  <title>Sales Visit Tracker V2</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <style>
    :root{--blue:#0b57d0;--blue-soft:#eaf2ff;--ink:#172033;--muted:#667085;--line:#dfe5ef;--bg:#f4f6fa;--green:#14804a;--orange:#b54708;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}main{max-width:1120px;margin:auto;padding:12px}.card{margin-bottom:12px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px #1018280c}.brand{font-weight:800}.muted{color:var(--muted)}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.btn{min-height:48px;padding:11px 14px;border:0;border-radius:12px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:var(--blue-soft);color:var(--blue)}.ghost{background:#fff;border:1px solid var(--line)}label{display:block;margin:12px 0 6px;font-size:13px;font-weight:800}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}textarea{min-height:76px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap;padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:#fff}.tab.on{background:var(--blue);color:#fff}.notice{margin:10px 0;padding:11px;border:1px solid #fed7aa;border-radius:11px;background:#fff7ed;color:#9a3412}.success{border-color:#b7e4c7;background:#e7f6ec;color:var(--green)}.bad{border-color:#fecaca;background:#fee2e2;color:var(--red)}.customer{margin:10px 0;padding:14px;border:1px solid var(--line);border-radius:14px}.metric{padding:14px;border:1px solid var(--line);border-radius:14px}.metric b{display:block;margin-top:5px;font-size:25px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted)}#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#fffffff0;font-weight:800}@media(max-width:720px){main{padding:9px}.g2,.g4{grid-template-columns:1fr}.row{align-items:stretch;flex-direction:column}.customer .btn{width:100%}table{display:block;overflow:auto}header{position:static}}
  </style>
</head>
<body>
<div id="loading"><div id="loadingText">Opening secure session…</div></div>
<header><div><div class="brand">Sales Visit Tracker</div><small class="muted">V2 Mobile Pilot</small></div><button id="logout" class="btn ghost hidden">Logout</button></header>
<main>
  <section id="login" class="hidden">
    <div class="card">
      <h1>Sign in</h1>
      <div class="tabs"><button class="tab on" data-mode="sales">Sales</button><button class="tab" data-mode="manager">Management</button></div>
      <form id="loginForm">
        <div id="salesFields"><label>Mobile number</label><input id="phone" type="tel" inputmode="tel" placeholder="+263…" autocomplete="username"><label>6-digit PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="current-password"></div>
        <div id="managerFields" class="hidden"><label>Username</label><input id="username" autocomplete="username" placeholder="boss or standly"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
        <button class="btn primary" style="width:100%;margin-top:16px" type="submit">Sign in</button>
      </form>
      <div id="loginMessage"></div>
    </div>
  </section>
  <section id="app" class="hidden">
    <div class="card"><div class="row"><div><h1 id="welcome"></h1><div id="today" class="muted"></div></div><span id="role" class="badge"></span></div><div id="network" class="notice success"></div></div>
    <div id="tabs" class="tabs"></div><div id="content"></div>
  </section>
</main>
<script>
const SUPABASE_URL='https://lamkijftrsceczhgmfyi.supabase.co';
const SUPABASE_KEY='sb_publishable_fYuxNsIp5PGM2seLzcHDhA_ce3BUae9';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dateISO=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
let mode='sales',authUser=null,profile=null,employees=[],customers=[],visits=[],assignments=[],tab='customers',activeVisit=null;
function busy(on,text='Working…'){$('loadingText').textContent=text;$('loading').classList.toggle('hidden',!on)}
function message(text,type='bad'){$('loginMessage').innerHTML=text?`<div class="notice ${type}">${esc(text)}</div>`:''}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));$('salesFields').classList.toggle('hidden',mode!=='sales');$('managerFields').classList.toggle('hidden',mode!=='manager');message('')});
$('loginForm').onsubmit=async e=>{e.preventDefault();busy(true,'Signing in securely…');message('');try{let credentials;if(mode==='sales'){const phone=$('phone').value.replace(/[\s()-]/g,'');const pin=$('pin').value;if(!/^\+263\d{9}$/.test(phone))throw Error('Use a Zimbabwe number in +263 format.');if(!/^\d{6}$/.test(pin))throw Error('Enter your 6-digit PIN.');credentials={email:`${phone.slice(1)}@sales-visit-tracker.internal`,password:pin}}else{const username=$('username').value.trim().toLowerCase();if(!['boss','standly'].includes(username))throw Error('Unknown management username.');credentials={email:`${username}@sales-visit-tracker.internal`,password:$('password').value}}const {error}=await db.auth.signInWithPassword(credentials);if(error)throw error;await openApp()}catch(err){message(err.message)}finally{busy(false)}};
$('logout').onclick=async()=>{await db.auth.signOut();showLogin()};
function showLogin(){$('app').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');profile=null}
async function openApp(){busy(true,'Loading your customers…');try{const {data:{user}}=await db.auth.getUser();if(!user)return showLogin();authUser=user;const {data:p,error}=await db.from('employees').select('*').eq('auth_user_id',user.id).single();if(error)throw error;if(p.employment_status!=='active')throw Error('This account is currently paused. Please contact Standly.');profile=p;const [e,c,v,a]=await Promise.all([db.from('employees').select('id,full_name,role,employment_status').order('full_name'),db.from('customers').select('*').eq('customer_status','active').order('customer_name'),db.from('visits').select('*').order('start_time',{ascending:false}),db.from('customer_assignments').select('*').eq('assignment_status','active')]);if(e.error)throw e.error;if(c.error)throw c.error;if(v.error)throw v.error;if(a.error)throw a.error;employees=e.data||[];customers=c.data||[];visits=v.data||[];assignments=a.data||[];await syncPending();activeVisit=visits.find(x=>x.sales_id===profile.id&&x.visit_status==='active')||null;tab=user.user_metadata?.initial_password_changed===true?(profile.role==='sales'?(activeVisit?'active':'customers'):'dashboard'):'change-password';$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');render()}catch(err){await db.auth.signOut();showLogin();message(err.message)}finally{busy(false)}}
function render(){if(!profile)return;$('welcome').textContent=`Welcome, ${profile.full_name}`;$('today').textContent=new Date().toLocaleDateString('en-ZW',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('role').textContent=profile.role==='sales'?'Sales Representative':profile.role==='boss'?'Boss':'Sales Director';network();if(tab==='change-password'){$('tabs').innerHTML='';$('content').innerHTML=changePasswordView();return}const defs=profile.role==='sales'?[['customers','My Customers'],['active','Active Visit'],['history','History'],['settings','Settings']]:[['dashboard','Dashboard'],['records','Visit Records'],['settings','Settings']];$('tabs').innerHTML=defs.map(([id,label])=>`<button class="tab ${tab===id?'on':''}" onclick="tab='${id}';render()">${label}</button>`).join('');$('content').innerHTML=tab==='settings'?changePasswordView(false):profile.role==='sales'?(tab==='customers'?customerView():tab==='active'?activeView():historyView()):(tab==='dashboard'?dashboardView():recordsView())}
function changePasswordView(required=true){const sales=profile.role==='sales';return `<div class="card"><h2>${required?'Create your private login':'Change login password'}</h2><p class="muted">${required?'Your temporary login must be replaced before continuing.':''}</p><label>${sales?'New 6-digit PIN':'New password (minimum 10 characters)'}</label><input id="newPassword" type="password" inputmode="${sales?'numeric':'text'}" maxlength="64"><label>Confirm</label><input id="confirmPassword" type="password" inputmode="${sales?'numeric':'text'}" maxlength="64"><button class="btn primary" style="width:100%;margin-top:14px" onclick="changePassword()">Save and continue</button></div>`}
async function changePassword(){const value=$('newPassword').value,confirm=$('confirmPassword').value,sales=profile.role==='sales';if(value!==confirm)return alert('The two entries do not match.');if(sales&&!/^\d{6}$/.test(value))return alert('Choose exactly 6 digits.');if(!sales&&value.length<10)return alert('Use at least 10 characters.');busy(true,'Saving your private login…');try{const {error}=await db.auth.updateUser({password:value,data:{initial_password_changed:true}});if(error)throw error;authUser.user_metadata={...(authUser.user_metadata||{}),initial_password_changed:true};tab=profile.role==='sales'?(activeVisit?'active':'customers'):'dashboard';render()}catch(err){alert(err.message)}finally{busy(false)}}
function network(){const pending=JSON.parse(localStorage.getItem('svt_pending')||'[]').length;$('network').className=`notice ${navigator.onLine?'success':''}`;$('network').textContent=navigator.onLine?(pending?`Online · ${pending} visit update(s) waiting to sync`:'Online · All records synced'):`Offline · Records will be saved on this phone`}
async function syncPending(){if(!navigator.onLine||!profile)return;const pending=JSON.parse(localStorage.getItem('svt_pending')||'[]'),remaining=[];for(const item of pending){const {error}=await db.from('visits').update({visit_status:'completed',end_time:item.finishedAt,visit_result:item.result,remark:item.remark,gps_verification_status:'offline_synced',evidence_status:'review',sync_status:'synced'}).eq('id',item.visitId);if(error)remaining.push(item)}localStorage.setItem('svt_pending',JSON.stringify(remaining))}
function customerView(){return `<div class="card"><div class="row"><div><h2>My Customers</h2><div class="muted">${customers.length} assigned or shared</div></div><input style="max-width:320px" id="search" placeholder="Search name, area or address" oninput="filterCustomers(this.value)"></div><div id="customerList">${customers.map(c=>`<div class="customer" data-search="${esc(`${c.customer_name} ${c.area||''} ${c.address||''}`.toLowerCase())}"><h3>${esc(c.customer_name)}</h3><div class="muted">${esc(c.area||'')} · ${esc(c.address||'')}</div><div class="grid g2" style="margin-top:10px"><button class="btn primary" onclick="startVisit('${c.id}')">Start Visit</button>${c.mobile_number?`<a class="btn secondary" style="text-align:center;text-decoration:none" href="https://wa.me/${esc(c.mobile_number.replace(/\D/g,''))}">WhatsApp</a>`:''}</div></div>`).join('')}</div></div>`}
function filterCustomers(q){q=q.toLowerCase().trim();document.querySelectorAll('#customerList .customer').forEach(x=>x.classList.toggle('hidden',!x.dataset.search.includes(q)))}
function gps(){return new Promise((resolve,reject)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>resolve({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),accuracy:Math.round(p.coords.accuracy)}),()=>reject(Error('Enable Location permission and try again.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0}):reject(Error('GPS is unavailable on this phone.')))}
function distance(a,b,c,d){const r=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;const h=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return Math.round(2*r*Math.asin(Math.sqrt(h)))}
async function startVisit(customerId){if(activeVisit)return alert('Finish your active visit first.');busy(true,'Getting GPS…');try{const g=await gps(),payload={sales_id:profile.id,customer_id:customerId,visit_status:'active',visit_date:dateISO(),start_time:new Date().toISOString(),start_latitude:g.lat,start_longitude:g.lng,start_accuracy_m:g.accuracy,device_info:navigator.userAgent,sync_status:'synced'};const {data,error}=await db.from('visits').insert(payload).select().single();if(error)throw error;activeVisit=data;visits.unshift(data);tab='active';render()}catch(err){alert(err.message)}finally{busy(false)}}
function activeView(){if(!activeVisit)return `<div class="card"><h2>No active visit</h2><p class="muted">Choose a customer to begin.</p></div>`;const c=customers.find(x=>x.id===activeVisit.customer_id)||{};return `<div class="card"><h2>${esc(c.customer_name)}</h2><div class="muted">Visit started ${new Date(activeVisit.start_time).toLocaleTimeString('en-ZW',{hour:'2-digit',minute:'2-digit'})}</div><label>Visit result</label><select id="result"><option value="">Select</option><option>Order Taken</option><option>No Order</option><option>Need Follow-up</option><option>Customer Unavailable</option><option>Payment Collected</option></select><label>Next action</label><select id="nextAction"><option value="">None</option><option>Call</option><option>Revisit</option><option>Send Quotation</option><option>Collect Payment</option></select><label>Next follow-up date</label><input id="followDate" type="date"><label>Order value (optional)</label><input id="orderValue" type="number" min="0" step="0.01" inputmode="decimal"><label>Short note (optional)</label><textarea id="remark"></textarea><button class="btn primary" style="width:100%;margin-top:14px" onclick="finishVisit()">Finish Visit</button></div>`}
async function finishVisit(){const result=$('result').value;if(!result)return alert('Select a visit result.');busy(true,'Finishing visit…');try{const g=await gps(),c=customers.find(x=>x.id===activeVisit.customer_id),d=c.standard_latitude==null?null:distance(g.lat,g.lng,c.standard_latitude,c.standard_longitude),status=g.accuracy>100?'low_accuracy':d==null?'customer_unverified':d<=150?'verified':'outside_range';const patch={visit_status:'completed',end_time:new Date().toISOString(),end_latitude:g.lat,end_longitude:g.lng,end_accuracy_m:g.accuracy,visit_result:result,remark:$('remark').value.trim(),next_action:$('nextAction').value||null,next_follow_up_date:$('followDate').value||null,order_value:$('orderValue').value?+$('orderValue').value:null,distance_from_customer_m:d,gps_verification_status:status,evidence_status:status==='verified'?'reliable':'review',sync_status:'synced'};const {data,error}=await db.from('visits').update(patch).eq('id',activeVisit.id).select().single();if(error)throw error;visits=visits.map(v=>v.id===data.id?data:v);activeVisit=null;tab='history';render()}catch(err){const pending=JSON.parse(localStorage.getItem('svt_pending')||'[]');pending.push({visitId:activeVisit.id,finishedAt:new Date().toISOString(),result,remark:$('remark').value.trim()});localStorage.setItem('svt_pending',JSON.stringify(pending));alert('Network or GPS failed. Your basic result was saved on this phone and is waiting to sync.');render()}finally{busy(false)}}
function historyView(){const mine=visits.filter(v=>v.sales_id===profile.id);return `<div class="card"><h2>My History</h2>${mine.map(v=>`<div class="customer"><b>${esc((customers.find(c=>c.id===v.customer_id)||{}).customer_name||v.customer_id)}</b><div class="muted">${esc(v.visit_result||v.visit_status)} · ${v.gps_verification_status?esc(v.gps_verification_status.replaceAll('_',' ')):''}</div></div>`).join('')||'<p class="muted">No visits yet.</p>'}</div>`}
function dashboardView(){const today=visits.filter(v=>v.visit_date===dateISO()),done=today.filter(v=>v.visit_status==='completed'),verified=done.filter(v=>v.gps_verification_status==='verified'),activeSales=employees.filter(e=>e.role==='sales'&&e.employment_status==='active');return `<div class="grid g4"><div class="metric">Active sales<b>${activeSales.length}</b></div><div class="metric">Visits today<b>${today.length}</b></div><div class="metric">Completed<b>${done.length}</b></div><div class="metric">GPS verified<b>${verified.length}</b></div></div><div class="card"><h2>Today by salesperson</h2><table><thead><tr><th>Sales</th><th>Started</th><th>Completed</th><th>Verified</th></tr></thead><tbody>${activeSales.map(e=>{const x=today.filter(v=>v.sales_id===e.id);return `<tr><td>${esc(e.full_name)}</td><td>${x.length}</td><td>${x.filter(v=>v.visit_status==='completed').length}</td><td>${x.filter(v=>v.gps_verification_status==='verified').length}</td></tr>`}).join('')}</tbody></table></div>`}
function recordsView(){return `<div class="card"><h2>Visit Records</h2><table><thead><tr><th>Date</th><th>Sales</th><th>Customer</th><th>Result</th><th>GPS</th></tr></thead><tbody>${visits.map(v=>`<tr><td>${esc(v.visit_date)}</td><td>${esc(v.sales_id)}</td><td>${esc((customers.find(c=>c.id===v.customer_id)||{}).customer_name||v.customer_id)}</td><td>${esc(v.visit_result||v.visit_status)}</td><td>${esc(v.gps_verification_status||'pending')}</td></tr>`).join('')}</tbody></table></div>`}
window.addEventListener('online',async()=>{await syncPending();network()});window.addEventListener('offline',network);
db.auth.onAuthStateChange((_event,session)=>{if(!session)showLogin()});
(async()=>{const {data:{session}}=await db.auth.getSession();session?await openApp():showLogin();busy(false)})();
</script>
</body>
</html>
